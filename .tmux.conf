unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g status-position top
set-option -g status-style bg=default

set -g mouse off

bind -n S-right next-window
bind -n S-left previous-window

# correcting colors
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Or use a wildcard instead of forcing a default mode.
# Some users in the comments of this gist have reported that this work better.
set -sg terminal-overrides ",*:RGB"

# You can also use the env variable set from the terminal.
# Useful if you share your configuration betweeen systems with a varying value.
set -ag terminal-overrides ",$TERM:RGB"

set -g pane-border-lines simple


# vim-like pane resizing  
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# vim-like pane switching
bind  k select-pane -U 
bind  j select-pane -D 
bind  h select-pane -L 
bind  l select-pane -R 

# and now unbind keys
unbind Up     
unbind Down   
unbind Left   
unbind Right  

unbind C-Up   
unbind C-Down 
unbind C-Left 
unbind C-Right

set -g default-terminal "xterm"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# setup clipboard
set -g allow-passthrough on

# Enable OSC 52 clipboard
set -s set-clipboard on

# Ensure tmux knows Alacritty supports the clipboard (Ms capability)
# For older tmux versions, use terminal-overrides:
set -as terminal-overrides ',alacritty:Ms=\E]52;c;%p2%s\007'

# For newer tmux versions (3.2+), you can also use:
set -as terminal-features ',alacritty:clipboard'

# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear pbcopy
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear pbcopy

set -g default-terminal "alacritty"

unbind n
bind-key n display-popup -h 3 -E "tmux-new-session"
